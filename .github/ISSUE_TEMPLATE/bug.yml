name: Bug report
description: Something is not working as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in what you can — device and
        connection details matter more here than a stack trace.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Connect over Wi-Fi
        2. Open Library → Papers
        3. …
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "0.2.0-1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Desktop OS
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Model and firmware if you know it.
      placeholder: "DPT-RP1, firmware 1.7.x"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Wi-Fi
        - USB
        - Bluetooth
        - Not connected / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or extras
      description: Optional. Paste a relevant log snippet, or note if it happens every time.
      render: shell
