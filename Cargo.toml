[workspace]
resolver = "2"
members = ["crates/dpt-core", "src-tauri"]

[workspace.package]
version = "0.4.1-1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Digital Paper Companion contributors"]
repository = ""

[workspace.dependencies]
# Path-only: a version constraint like `^0.1.0` rejects workspace
# pre-releases (Cargo will not match `0.2.0-1` against `^0.1.0`).
dpt-core = { path = "crates/dpt-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
